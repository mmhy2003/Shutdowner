<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shutdowner</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="dashboard" data-csrf="{{.CSRFToken}}" data-delay="{{.DelaySeconds}}">
  <!-- The attributes carry the file's own dimensions so the browser reserves
       the right space before it loads; app.css picks the displayed size. -->
  <img class="logo" src="/static/logo.png" width="480" height="257" alt="Remote Shutdown">
  <main class="card">
    <header class="status">
      <div class="titlebar">
        <h1 id="hostname">{{.Info.Hostname}}</h1>
        <span id="reachability" class="badge online">online</span>
      </div>
      <p id="os" class="muted">{{.Info.OS}}</p>
      <p class="muted"><span id="uptime"></span> · <span id="localtime"></span></p>
    </header>

    <section class="actions">
      <button class="action" data-action="shutdown">Shut down</button>
      <button class="action" data-action="restart">Restart</button>
      <button class="action" data-action="sleep"
        {{if not .Capabilities.Sleep}}disabled title="Sleep is not available on this system"{{end}}>Sleep</button>
      <button class="action" data-action="hibernate"
        {{if not .Capabilities.Hibernate}}disabled title="Hibernate is not enabled on this system"{{end}}>Hibernate</button>
    </section>

    <section class="pending hidden" id="pending">
      <p id="pending-text"></p>
      <button id="abort" class="primary">Abort</button>
    </section>

    <p class="error hidden" id="error" role="alert"></p>

    <div class="missed hidden" id="missed" role="alert">
      <p id="missed-text"></p>
      <button type="button" id="dismiss" class="link">Dismiss</button>
    </div>

    <form method="post" action="/logout" class="logout">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button type="submit" class="link">Sign out</button>
    </form>
  </main>

  <dialog id="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <label class="checkbox"><input type="checkbox" id="graceful"> Close apps gracefully</label>

      <fieldset class="when">
        <legend>When</legend>
        <label class="radio">
          <input type="radio" name="when" value="now" checked>
          <span id="when-now-label">Now</span>
        </label>
        <label class="radio">
          <input type="radio" name="when" value="in">
          In
          <input type="number" id="when-in-value" min="1" max="10080" value="1" inputmode="numeric">
          <select id="when-in-unit">
            <option value="60">minutes</option>
            <option value="3600" selected>hours</option>
          </select>
        </label>
        <label class="radio">
          <input type="radio" name="when" value="at">
          At
          <input type="datetime-local" id="when-at">
        </label>
        <p class="hint hidden" id="tz-note"></p>
      </fieldset>

      <p class="hint">Leave unchecked to force apps closed. Unsaved work will be lost.</p>
      <menu>
        <button value="cancel">Cancel</button>
        <button value="confirm" class="danger">Confirm</button>
      </menu>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
